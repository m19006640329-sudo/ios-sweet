name: probe
on:
  workflow_dispatch:
  push:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          xcodebuild -version