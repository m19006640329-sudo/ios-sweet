name: sagit-build

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      qemu_secs:
        description: QEMU boot duration in seconds
        default: "25"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "tests/sagit-lse/**"
      - ".github/workflows/sagit.yml"

concurrency:
  group: sagit-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: SAGIT

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    outputs:
      kernel-artifact: xnu-kernel-sagit
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build SAGIT kernel
        working-directory: dxb
        env:
          MAKEFLAGS: -k
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log
          # dxb ships a few upstream patches that are intentionally skipped on
          # this source drop, so only the patches we supply are required.
          fail=0
          for src in "$GITHUB_WORKSPACE"/xnu/patches/*.patch; do
            base=$(basename "$src")
            case "$base" in
              0031-sweet-read-write-root.patch|0041-sweet-hfs-link-notes.patch)
                # Target bsd/sweet_hfs, which this source drop does not carry.
                continue ;;
            esac
            if grep -Fq "Skipping patch $PWD/patches/$base" build.log; then
              echo "::error::SAGIT patch did not apply: $base"
              fail=1
            fi
          done
          exit $fail

      - name: Collect kernel
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-sagit
          path: out/
          if-no-files-found: warn

  qemu-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm llvm

      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel-sagit
          path: kernel/

      - name: Build QEMU payload
        run: |
          KERNEL=$(ls kernel/kernel.* | head -1)
          echo "Using kernel: $KERNEL"
          python3 tools/mkadt.py qemu.adt --qemu
          python3 tools/mkpayload.py "$KERNEL" qemu.adt payload.bin
          ls -la payload.bin

      - name: Boot on cortex-a53 (Kryo 280 class, no 16K granule)
        # SAGIT uses XNU's native 4K page-table layout.  Test on the same
        # ARMv8.0 / TGran16=unsupported class as real hardware; cortex-a76
        # masked the former 16K-granule bug because it supports 16K pages.
        run: |
          KERNEL=$(ls kernel/kernel.* | head -1)
          set +e
          python3 tools/qemu-sweet.py payload.bin qemu-out/ \
            --cpu cortex-a53 \
            --secs ${{ inputs.qemu_secs || '25' }} \
            --kernel "$KERNEL" \
            --fail-on-panic \
            --live-serial
          rc=$?
          set -e
          echo "qemu-sweet exit=$rc"
          # exit 2 = visible panic, always a failure
          if [ "$rc" -eq 2 ]; then
            echo "::error::kernel panicked"
            exit 1
          fi
          # exit 3 = screen decode incomplete (the framebuffer is a circular
          # snapshot); accept it as long as BSD bootstrap was reached.
          if [ "$rc" -ne 0 ] && ! grep -q "VM bootstrap done" qemu-out/fb.txt; then
            echo "::error::kernel did not reach BSD bootstrap (exit=$rc)"
            exit 1
          fi

      - name: Show results
        if: always()
        run: |
          echo "=== result.json ==="
          cat qemu-out/result.json 2>/dev/null || true
          echo "=== fb.txt (screen decode) ==="
          head -60 qemu-out/fb.txt 2>/dev/null || true
          echo "=== serial (tail) ==="
          tail -80 qemu-out/serial.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sagit-qemu-cortex-a53
          path: qemu-out/
          retention-days: 14

  lse-selftest:
    # Independent bare-metal check of the 224 sagit_* LSE helpers extracted
    # from xnu/patches/0084: semantics vs a C reference model, fault recovery
    # through the copyio vector table, and instruction decoding of the
    # assembler-emitted 224 LSE encodings. Runs on cortex-a53 (ARMv8.0, no LSE).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-arm python3

      - name: Build self-test
        run: bash tests/sagit-lse/build.sh

      - name: Run on cortex-a53 (no LSE)
        run: bash tests/sagit-lse/run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sagit-lse-selftest
          path: tests/sagit-lse/build/serial.txt
          if-no-files-found: warn
          retention-days: 14
